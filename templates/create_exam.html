{% extends "base.html" %}
{% block content %}
<div class="school-title-banner">
    <h4>S3560 UCHILE SECONDARY SCHOOL</h4>
    <h5>CREATE EXAM</h5>
</div>

<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-2">
            <label style="color:#000080;font-weight:bold;">Exam Name *</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6 mb-2">
            <label style="color:#000080;font-weight:bold;">Exam Type *</label>
            <select name="exam_type" class="form-select" required>
                {% for code, label in exam_types %}
                <option value="{{ code }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-2">
            <label style="color:#000080;font-weight:bold;">Target Class *</label>
            <select name="target_class" class="form-select" required>
                <option value="">-- Select Class --</option>
                {% for c in classes %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-2">
            <label style="color:#000080;font-weight:bold;">Academic Year *</label>
            <select name="academic_year" class="form-select" required>
                {% for y in years %}
                <option value="{{ y }}">{{ y }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-2">
            <label style="color:#000080;font-weight:bold;">Term/Month *</label>
            <select name="term" class="form-select" required>
                <option value="">-- Select Month --</option>
                {% for code, name in months %}
                <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-2">
            <label style="color:#000080;font-weight:bold;">Exam Date *</label>
            <input type="date" name="date" class="form-control" required>
        </div>
        <div class="col-md-4 mb-2 d-flex align-items-end">
            <div class="form-check">
                <input type="checkbox" name="is_necta_exam" value="true" class="form-check-input" id="nectaCheck">
                <label class="form-check-label" for="nectaCheck" style="color:#000080;font-weight:bold;">
                    Is this a NECTA Exam?
                </label>
            </div>
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary" style="background-color:#000080; padding:10px 30px;">
            Create Exam
        </button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
